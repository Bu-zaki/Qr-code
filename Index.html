<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤلف رموز QR الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Kufi+Arabic:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto+Kufi+Arabic', sans-serif;
            background-color: #f8fafc;
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        #canvas-container canvas {
            max-width: 100%;
            height: auto !important;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-slate-800 mb-3">مصمم رموز QR الذكي</h1>
            <p class="text-slate-500 text-lg">أنشئ رموز QR مخصصة لهويتك التجارية في ثوانٍ</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Settings Panel -->
            <div class="lg:col-span-7 bg-white rounded-3xl p-6 md:p-8 custom-shadow border border-slate-100">
                <div class="space-y-8">
                    
                    <!-- URL Input -->
                    <section>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">الرابط أو النص (إجباري)</label>
                        <input type="text" id="qr-data" placeholder="https://example.com" 
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-left" dir="ltr">
                    </section>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Color Settings -->
                        <section>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">لون الرمز</label>
                            <div class="flex items-center gap-3 p-2 border border-slate-200 rounded-xl">
                                <input type="color" id="dots-color" value="#4f46e5" class="h-10 w-20 rounded cursor-pointer bg-transparent">
                                <span class="text-slate-500 text-sm" id="dots-color-val">#4f46e5</span>
                            </div>
                        </section>

                        <section>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">لون الخلفية</label>
                            <div class="flex items-center gap-3 p-2 border border-slate-200 rounded-xl">
                                <input type="color" id="bg-color" value="#ffffff" class="h-10 w-20 rounded cursor-pointer bg-transparent">
                                <span class="text-slate-500 text-sm" id="bg-color-val">#ffffff</span>
                            </div>
                        </section>
                    </div>

                    <!-- Pattern Styles -->
                    <section>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">شكل النقاط (النمط)</label>
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-2">
                            <button onclick="updateStyle('dots', 'square')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition active">مربع</button>
                            <button onclick="updateStyle('dots', 'dots')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">منقط</button>
                            <button onclick="updateStyle('dots', 'rounded')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">دائري</button>
                            <button onclick="updateStyle('dots', 'extra-rounded')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">ناعم</button>
                            <button onclick="updateStyle('dots', 'classy')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">كلاسيكي</button>
                            <button onclick="updateStyle('dots', 'classy-rounded')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">فخم</button>
                        </div>
                    </section>

                    <!-- Corner Styles -->
                    <section>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">شكل الزوايا</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            <button onclick="updateStyle('corners', 'square')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">مربع</button>
                            <button onclick="updateStyle('corners', 'dot')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">دائري</button>
                            <button onclick="updateStyle('corners', 'extra-rounded')" class="style-btn p-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition">منحني</button>
                        </div>
                    </section>

                    <!-- Logo Upload -->
                    <section>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">شعار الشركة (اختياري)</label>
                        <div class="flex items-center justify-center w-full">
                            <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                    <svg class="w-8 h-8 mb-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                    <p class="mb-2 text-sm text-slate-500"><span class="font-semibold">اضغط لرفع الشعار</span></p>
                                    <p class="text-xs text-slate-400">PNG, JPG (يفضل خلفية شفافة)</p>
                                </div>
                                <input id="logo-upload" type="file" class="hidden" accept="image/*" />
                            </label>
                        </div>
                    </section>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                <div class="bg-indigo-600 rounded-3xl p-8 custom-shadow flex flex-col items-center justify-center min-h-[400px]">
                    <h3 class="text-white font-semibold mb-6">معاينة الرمز</h3>
                    
                    <div id="canvas-container" class="bg-white p-4 rounded-3xl shadow-2xl overflow-hidden mb-8">
                        <!-- QR Code will be rendered here -->
                    </div>

                    <div class="w-full flex flex-col gap-3">
                        <button id="download-btn" class="w-full bg-white text-indigo-600 font-bold py-4 rounded-2xl hover:bg-indigo-50 transition-colors shadow-lg flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            تحميل الرمز (PNG)
                        </button>
                        <p class="text-indigo-100 text-xs text-center opacity-70">سيتم حفظ الرمز بجودة عالية</p>
                    </div>
                </div>

                <!-- Tips Card -->
                <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
                    <h4 class="font-bold text-slate-800 mb-2 flex items-center gap-2">
                        <span class="text-yellow-500">💡</span> نصيحة للمحترفين
                    </h4>
                    <p class="text-slate-600 text-sm leading-relaxed">
                        عند إضافة شعار، تأكد من أن الرمز لا يزال قابلاً للمسح. اختر ألواناً ذات تباين عالٍ (داكن للرمز وفاتح للخلفية) لضمان سهولة القراءة بواسطة الهواتف.
                    </p>
                </div>
            </div>

        </main>
    </div>

    <script>
        // Configuration state
        const config = {
            width: 300,
            height: 300,
            data: "https://google.com",
            image: "",
            dotsOptions: {
                color: "#4f46e5",
                type: "square"
            },
            backgroundOptions: {
                color: "#ffffff",
            },
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 10,
                imageSize: 0.4
            },
            cornersSquareOptions: {
                type: "square",
                color: "#4f46e5"
            }
        };

        // Initialize QR Code
        const qrCode = new QRCodeStyling(config);

        // Rendering logic
        window.onload = () => {
            const container = document.getElementById("canvas-container");
            qrCode.append(container);
            
            // Initial render
            updateQR();
        };

        // UI Selectors
        const dataInput = document.getElementById('qr-data');
        const dotsColorInput = document.getElementById('dots-color');
        const bgColorInput = document.getElementById('bg-color');
        const logoUpload = document.getElementById('logo-upload');
        const downloadBtn = document.getElementById('download-btn');

        // Functions
        function updateQR() {
            config.data = dataInput.value || "https://example.com";
            config.dotsOptions.color = dotsColorInput.value;
            config.cornersSquareOptions.color = dotsColorInput.value;
            config.backgroundOptions.color = bgColorInput.value;
            
            document.getElementById('dots-color-val').innerText = dotsColorInput.value;
            document.getElementById('bg-color-val').innerText = bgColorInput.value;

            qrCode.update(config);
        }

        function updateStyle(category, type) {
            if (category === 'dots') {
                config.dotsOptions.type = type;
            } else if (category === 'corners') {
                config.cornersSquareOptions.type = type;
            }
            updateQR();
        }

        // Event Listeners
        dataInput.addEventListener('input', updateQR);
        dotsColorInput.addEventListener('input', updateQR);
        bgColorInput.addEventListener('input', updateQR);

        // Logo Handler
        logoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    config.image = event.target.result;
                    updateQR();
                };
                reader.readAsDataURL(file);
            }
        });

        // Download Handler
        downloadBtn.addEventListener('click', () => {
            if (!dataInput.value) {
                // simple notification instead of alert
                const originalText = downloadBtn.innerHTML;
                downloadBtn.innerHTML = "يرجى إدخال الرابط أولاً!";
                downloadBtn.classList.replace('bg-white', 'bg-red-100');
                setTimeout(() => {
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.classList.replace('bg-red-100', 'bg-white');
                }, 2000);
                return;
            }
            qrCode.download({ name: "my-custom-qr", extension: "png" });
        });

    </script>
</body>
</html>
